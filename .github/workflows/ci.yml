name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check and schema validation
        run: npx astro check

      - name: Build
        run: npm run build
